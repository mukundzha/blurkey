[project]
name = "blurkey"
version = "0.1.0"
description = "Free, offline CLI that redacts API keys, tokens, emails and IPs in screenshots and GIFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "blurkey" }]

keywords = ["ocr", "redaction", "privacy", "screenshot", "gif", "api-keys"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
  "rich>=13.0",
  "rapidocr-onnxruntime==1.2.3",
]

[project.urls]
Homepage = "https://github.com/anomalyco/blurkey"
Repository = "https://github.com/anomalyco/blurkey"

[project.scripts]
blurkey = "blurkey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurkey"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
